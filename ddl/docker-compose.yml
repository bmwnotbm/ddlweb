services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pharma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pharma}
      POSTGRES_DB: ${POSTGRES_DB:-pharma_db}
    volumes:
      - pharma_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pharma} -d ${POSTGRES_DB:-pharma_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- ทางเลือก B: รัน Ollama ใน Docker (ไม่เปิดโดยปริยาย) ---
  # เปิดด้วย: docker compose --profile ollama up --build   และตั้ง OLLAMA_URL=http://ollama:11434 ใน .env
  # ทางเลือก A (แนะนำสำหรับ Windows + การ์ดจอ NVIDIA): ลง Ollama บนเครื่องโดยตรง ใช้ GPU ได้เลย ไม่ต้องตั้งค่า Docker เพิ่ม
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    # ใช้ GPU ของ NVIDIA: เอาคอมเมนต์ข้างล่างออก (ต้องมี NVIDIA Container Toolkit / Docker Desktop + WSL2)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}"]
    depends_on:
      ollama:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-pharma}:${POSTGRES_PASSWORD:-pharma}@db:5432/${POSTGRES_DB:-pharma_db}
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      FRONTEND_ORIGIN: http://localhost:3000
      UPLOAD_DIR: uploads
      MAX_UPLOAD_SIZE_MB: 5
      CHAT_BACKEND: ${CHAT_BACKEND:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    # ให้ container เรียก Ollama ที่ลงบนเครื่องโฮสต์ได้ (Windows/Mac ใช้ได้อยู่แล้ว บรรทัดนี้ช่วยฝั่ง Linux)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pharma_db_data:
  ollama_data:
